<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector AI</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; text-align: center; padding: 50px; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0px 0px 10px 0px #00000020; max-width: 600px; margin: auto; }
        textarea { width: 100%; height: 150px; padding: 10px; margin-bottom: 20px; font-size: 16px; border: 1px solid #ccc; border-radius: 5px; }
        button { background-color: #28a745; color: white; padding: 10px 20px; border: none; font-size: 18px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #218838; }
        h2 { color: #333; }
        .result { margin-top: 20px; font-size: 24px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Fake News Detector API</h2>
        <p>Paste any news article below to check if it's real or fake.</p>

        <form action="/predict", method="POST">
            <textarea name="news_text" placeholder="Enter news text here..." id="" required>
                {{original_text}}
            </textarea>
            <br>
            <button type="submit">Analyze News</button>
        </form>
        {% if prediction_text %}
            <div class="result">
                {{prediction_text}}
            </div>
        {% endif %}    
    </div>
</body>
</html>
